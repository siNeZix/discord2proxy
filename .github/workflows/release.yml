name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Derive version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build CLI
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-s -w -X discord-szx/internal/config.Version=${{ steps.ver.outputs.version }}" \
            -o build/d2p-cli.exe ./cmd/

      - name: Build GUI
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X discord-szx/internal/config.Version=${{ steps.ver.outputs.version }}" \
            -o build/d2p.exe ./cmd/gui/

      - name: Build Setup
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-s -w -X discord-szx/internal/config.Version=${{ steps.ver.outputs.version }}" \
            -o build/d2p-setup.exe ./cmd/setup/

      - name: Set up UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build Setup UPX
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-s -w -X discord-szx/internal/config.Version=${{ steps.ver.outputs.version }}" \
            -o build/d2p-setup-upx.exe ./cmd/setup/
          upx --best --lzma build/d2p-setup-upx.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/d2p-cli.exe
            build/d2p.exe
            build/d2p-setup.exe
            build/d2p-setup-upx.exe
